[workspace]
resolver = "2"
members = [
    "crates/ganglion-core",
    "crates/ganglion-mcp",
    "crates/ganglion-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/JuanMarchetto/ganglion"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
