[package]
name = "ganglion-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Distributed agent memory on CockroachDB: hybrid vector+keyword recall, multi-tenant isolation in the index."

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
parking_lot = "0.12"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }
tracing.workspace = true
uuid = { version = "1", default-features = false, features = ["v4", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
