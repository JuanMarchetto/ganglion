[package]
name = "ganglion-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP stdio server exposing Ganglion agent memory (remember / recall / recall_asof / supersede / timeline / verify_ledger)."

[dependencies]
anyhow.workspace = true
ganglion-core = { path = "../ganglion-core" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
uuid = { version = "1", default-features = false, features = ["v4", "std"] }
