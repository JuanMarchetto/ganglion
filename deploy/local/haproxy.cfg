global
    maxconn 4096

defaults
    mode tcp
    timeout connect 10s
    timeout client  30m
    timeout server  30m
    option clitcpka

# SQL traffic, load-balanced with health checks against the CRDB ready endpoint.
# This is what makes the kill-node demo work: haproxy stops routing to a dead
# node within seconds, and reconnecting clients land on a survivor.
#
# `on-marked-down shutdown-sessions` is the load-bearing part, and it is not
# optional. Routing *new* connections away from a dead node is not enough: a
# connection already established through haproxy to a node that is SIGKILLed
# never receives a FIN, so haproxy holds that session open under
# `timeout server` while the client blocks on it. Measured without this
# directive, one pooled connection stalled ~40s — the kernel's retransmit
# budget — before failing over, which is both a ruined live demo and the p99
# tail. With it, the failed health check tears the session down and the
# client's pool reconnects to a survivor in about a second.
listen psql
    bind :26257
    mode tcp
    balance roundrobin
    option httpchk GET /health?ready=1
    default-server check port 8080 inter 1s fall 2 rise 3 on-marked-down shutdown-sessions
    server roach1 roach1:26257
    server roach2 roach2:26257
    server roach3 roach3:26257

listen http
    bind :8080
    mode tcp
    balance roundrobin
    server roach1 roach1:8080 check
    server roach2 roach2:8080 check
    server roach3 roach3:8080 check
